name: Build documentation

on:
  push:
    branches:
      - main

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/build_main_documentation.yml@17ccdf17e0f5e5f88b1ce9f20b3b73fb19017169  # main
    with:
      commit_sha: ${{ github.sha }}
      package: smol-course
      package_name: smol-course
      path_to_docs: smol-course/units/
      additional_args: --not_python_module
      languages: en es ja ko pt-br vi
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
